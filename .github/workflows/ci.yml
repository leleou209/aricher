name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # 生成 worker-configuration.d.ts（已 gitignore，新克隆必跑）
      - run: npm run types
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
